<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Ad Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'League Spartan', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[#f0bc00] px-4 overflow-hidden relative font-['League_Spartan']">
    <!-- Background Decoration -->
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-white rounded-full blur-3xl opacity-10 pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-red-500 rounded-full blur-3xl opacity-10 pointer-events-none"></div>

    <div class="max-w-2xl w-full text-center z-10">
        <div class="mb-8 flex justify-center">
            <div class="bg-white p-6 rounded-full shadow-2xl">
                <svg xmlns="http://www.w3.org/2003/svg" class="w-24 h-24 text-green-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
        </div>

        <h1 class="text-5xl md:text-7xl font-black text-black mb-6 leading-tight uppercase font-black">
            THANK <span class="text-white">YOU!</span>
        </h1>
        
        <div class="flex items-center justify-center gap-2 mb-6 text-2xl font-bold text-gray-900">
            <span>Success! We've received your request.</span>
        </div>

        <p class="text-xl md:text-2xl text-gray-800 mb-12 max-w-lg mx-auto leading-relaxed">
            Our specialized strategy team is already reviewing your goals. 
            <span class="block mt-2 font-bold">Expect a call from us within 24 hours.</span>
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
            <a href="/" class="bg-black text-white hover:bg-gray-900 text-xl font-bold py-4 px-10 rounded-2xl shadow-2xl transition-all duration-300 transform hover:scale-105 inline-flex items-center uppercase">
                <svg xmlns="http://www.w3.org/2003/svg" class="mr-3 w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Results
            </a>
        </div>
    </div>

    <!-- Decorative Floor -->
    <div class="absolute bottom-0 left-0 right-0 h-2 bg-gradient-to-r from-red-600 via-white to-red-600 opacity-20"></div>
</body>
</html>
